<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Edit ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: #f8eaff;
      font-family: 'Cormorant Garamond', serif;
      background:
        radial-gradient(ellipse at 15% 20%, #392052 0%, transparent 35%),
        radial-gradient(ellipse at 85% 70%, #301548 0%, transparent 38%),
        linear-gradient(160deg, #080513, #140b27 55%, #080513);
      position: relative;
    }

    /* Starry background */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff2ff;
      border-radius: 50%;
      box-shadow: 0 0 8px 2px rgba(210, 150, 255, 0.6);
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    .moon {
      position: absolute;
      top: 35px;
      right: 8%;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #ffe9bd;
      box-shadow: 0 0 35px rgba(255, 207, 155, 0.45);
    }

    .moon::after {
      content: '';
      position: absolute;
      top: -9px;
      left: 18px;
      width: 63px;
      height: 63px;
      border-radius: 50%;
      background: #100a20;
    }

    .nebula {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
    }

    .nebula.one {
      background: #a14aff;
      top: 25%;
      left: -150px;
    }

    .nebula.two {
      background: #e28bff;
      bottom: -120px;
      right: -100px;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100% - 32px, 950px);
      margin: 0 auto;
      padding: 65px 0 35px;
      text-align: center;
    }

    .eyebrow {
      letter-spacing: 5px;
      text-transform: uppercase;
      font-size: 12px;
      color: #d8b9f5;
      margin-bottom: 15px;
    }

    h1 {
      font-family: 'Caveat', cursive;
      font-weight: 500;
      font-size: clamp(54px, 9vw, 88px);
      line-height: 1.1;
      color: #f6dfff;
      text-shadow: 0 0 25px rgba(207, 131, 255, 0.35);
    }

    .heart-divider {
      margin: 10px auto 20px;
      color: #e9baff;
      font-size: 28px;
    }

    .intro {
      max-width: 560px;
      margin: 0 auto 34px;
      font-size: 19px;
      line-height: 1.7;
      color: #e4d4f0;
    }

    .video-frame {
      padding: 10px;
      border: 1px solid rgba(200, 125, 255, 0.75);
      border-radius: 18px;
      background: rgba(20, 10, 36, 0.75);
      box-shadow:
        0 0 35px rgba(153, 76, 255, 0.2),
        inset 0 0 20px rgba(155, 83, 255, 0.07);
    }

    video {
      display: block;
      width: 100%;
      max-height: 75vh;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #05030a;
      border-radius: 10px;
    }

    .upload-area {
      padding: 22px 10px 12px;
    }

    .upload-button {
      display: inline-block;
      padding: 11px 22px;
      border: 1px solid #cba0f5;
      border-radius: 30px;
      background: rgba(135, 75, 185, 0.17);
      color: #f8eaff;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .upload-button:hover {
      background: rgba(167, 104, 222, 0.3);
      box-shadow: 0 0 20px rgba(193, 125, 255, 0.25);
      transform: translateY(-2px);
    }

    #videoUpload {
      display: none;
    }

    .upload-note {
      margin-top: 10px;
      color: #bba8cc;
      font-size: 13px;
    }

    .message {
      margin: 45px auto 35px;
      font-family: 'Caveat', cursive;
      font-size: clamp(25px, 4vw, 34px);
      line-height: 1.5;
      color: #e9cbff;
    }

    .back-link {
      display: inline-block;
      margin-top: 5px;
      padding: 12px 20px;
      color: #e8d4fa;
      text-decoration: none;
      border: 1px solid transparent;
      border-radius: 30px;
      transition: 0.25s ease;
    }

    .back-link:hover {
      border-color: rgba(210, 164, 255, 0.45);
      background: rgba(173, 105, 231, 0.1);
    }

    footer {
      padding: 20px;
      color: #8f7ba6;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      main {
        padding-top: 80px;
      }

      .moon {
        width: 42px;
        height: 42px;
        top: 18px;
        right: 18px;
      }

      .moon::after {
        width: 42px;
        height: 42px;
        top: -6px;
        left: 12px;
      }

      .intro {
        font-size: 17px;
      }

      .video-frame {
        padding: 6px;
        border-radius: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="stars" id="stars"></div>
  <div class="moon"></div>
  <div class="nebula one"></div>
  <div class="nebula two"></div>

  <main>
    <p class="eyebrow">— Just for you —</p>

    <h1>A Little Edit</h1>

    <div class="heart-divider">♡</div>

    <p class="intro">
      
    </p>

    <section class="video-frame">
      <video id="birthdayVideo" controls playsinline preload="metadata">
        <source src="EditVdo.mp4" type="video/mp4">
        Your browser does not support video playback.
      </video>

      
    </section>

    <p class="message">
      I hope this little edit<br>
      brings a smile to your beautiful face. ♡
    </p>

    <a class="back-link" href="index.html">
      ← Back to the stars
    </a>

    <footer>
      Made with love, just for you ✧
    </footer>
  </main>

  <script>
    // Create random twinkling stars
    const starContainer = document.getElementById('stars');

    for (let i = 0; i < 100; i++) {
      const star = document.createElement('span');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 4 + 's';
      star.style.animationDuration = (2 + Math.random() * 3) + 's';
      starContainer.appendChild(star);
    }

    // Allow a video to be selected directly from the computer
    const videoUpload = document.getElementById('videoUpload');
    const birthdayVideo = document.getElementById('birthdayVideo');

    let uploadedVideoURL = null;

    videoUpload.addEventListener('change', function () {
      const file = this.files[0];

      if (!file) return;

      if (uploadedVideoURL) {
        URL.revokeObjectURL(uploadedVideoURL);
      }

      uploadedVideoURL = URL.createObjectURL(file);
      birthdayVideo.src = uploadedVideoURL;
      birthdayVideo.load();
    });
  </script>
</body>
</html>
```
